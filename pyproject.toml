[project]
name = "job-application-hub"
version = "0.1.0"
description = "Local-first job application pipeline: intake, materials, tracking, catastrophe detection"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jam = "hub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
